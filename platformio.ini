[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
monitor_speed = 115200

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
    links2004/WebSockets @ 2.6.1
    bblanchon/ArduinoJson @ 7.4.3

; Firmware updates over Wi-Fi, after one USB flash of a build with
; VIBE_OTA_PASSWORD set. From any machine on the LAN:
;   export VIBE_OTA_PASSWORD='same as in include/secrets.h'
;   pio run -e m5stack-stopwatch-ota -t upload --upload-port <watch IP>
; The watch connects back to the uploading machine on TCP 3233.
[env:m5stack-stopwatch-ota]
extends = env:m5stack-stopwatch
upload_protocol = espota
upload_port = vibe-watch-1.local
upload_flags =
    --port=3232
    --host_port=3233
    --auth=${sysenv.VIBE_OTA_PASSWORD}

; Host-side unit tests for hardware-independent logic: `pio test -e native`
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17
lib_deps =
